<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bullet vs. Water Balloon — ray-traced SPH</title>
<style>
  html,body{margin:0;height:100%;background:#0b0d10;color:#e8eaed;font:12px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
  #hud{position:fixed;left:12px;top:10px;padding:8px 10px;background:rgba(10,12,16,.55);border-radius:8px;backdrop-filter:blur(6px);pointer-events:none;font-variant-numeric:tabular-nums;max-width:330px}
  #hud b{color:#ffd27a;text-transform:uppercase;letter-spacing:.06em} #hud u{text-decoration:none;color:#8fd0ff}
  #panel{position:fixed;right:10px;top:10px;bottom:62px;width:270px;overflow:auto;padding:4px 10px 8px;background:rgba(10,12,16,.66);border-radius:10px;backdrop-filter:blur(8px)}
  .nopanel #panel{display:none}
  .grp h3{margin:10px 0 4px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#9aa4b1;font-weight:600}
  .grp h3 i{text-transform:none;letter-spacing:0;font-weight:400;color:#6f7884}
  .row{display:grid;grid-template-columns:100px 1fr 66px;gap:6px;align-items:center;margin:2px 0}
  .row b{font-weight:500;text-align:right;font-variant-numeric:tabular-nums;color:#cfd6de}
  .row input[type=range]{width:100%;min-width:0;accent-color:#5cb0ff;height:14px}
  .row select{grid-column:2/4;background:#1a1f27;color:#e8eaed;border:1px solid #333b47;border-radius:5px;padding:2px}
  .row.chk{grid-template-columns:18px 1fr}.row.chk input{margin:0}
  #bar{position:fixed;left:10px;right:10px;bottom:10px;display:flex;gap:8px;align-items:center;padding:8px 10px;background:rgba(10,12,16,.66);border-radius:10px;backdrop-filter:blur(8px)}
  #bar button{background:#1d2633;color:#e8eaed;border:1px solid #37435a;border-radius:6px;padding:5px 10px;font:inherit;cursor:pointer;white-space:nowrap}
  #bar button:hover{background:#2a3850} #play{min-width:84px;background:#24507e!important}
  #tl{flex:1;min-width:60px;accent-color:#ffd27a} #time{min-width:64px;text-align:right;font-variant-numeric:tabular-nums}
  #tip{color:#8a94a2;white-space:nowrap} @media(max-width:900px){#tip{display:none}}
  #err{display:none;position:fixed;inset:10% 10%;padding:16px;background:#300;color:#fbb;white-space:pre-wrap;font:12px monospace;overflow:auto;z-index:9;border-radius:8px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"></div>
<div id="panel"><div id="groups"></div></div>
<div id="bar">
  <button id="play">❚❚ Freeze</button><button id="back" title="Previous frame (←)">◀</button><button id="step" title="Next frame (→)">▶|</button>
  <button id="restart" title="R">↻ Fire again</button>
  <input id="tl" type="range" min="0" max="1" value="1" title="Timeline: drag to replay any recorded moment">
  <span id="time"></span>
  <span id="tip">drag: orbit · shift/right-drag: pan · wheel: zoom · space: freeze</span>
  <button id="hide" title="H">☰</button>
</div>
<pre id="err"></pre>
<script id="fs" type="x-shader/x-fragment">
#version 300 es
precision highp float; precision highp sampler3D; precision highp int;
out vec4 o;
uniform vec2 uRes; uniform vec4 uJit;
uniform vec3 uCP,uCR,uCU,uCF; uniform float uTanF;
uniform sampler3D uVol,uMist; uniform sampler2D uWet;
uniform vec3 uBMin,uBMax,uUsed,uTexI,uMUsed,uMTexI; uniform float uVox;
uniform float uTime,uTe,uTx,uVret,uHole,uMemOn;
uniform vec3 uBC; uniform float uBR;
uniform vec3 uEd,uEb1,uXd,uXb1;
uniform vec3 uRub; uniform float uRubA;
uniform vec4 uBul; uniform vec3 uBulD;
uniform vec3 uSun,uSunC,uAbs; uniform float uSkyI,uIor,uMistK,uDom,uLdr,uExp,uSoft;
uniform int uShN; uniform vec3 uShC[6],uShA[6],uShB[6],uShD[6];
vec2 gR;
const vec3 HOR=vec3(.60,.74,.93);

float hash12(vec2 p){vec3 q=fract(vec3(p.xyx)*.1031);q+=dot(q,q.yzx+33.33);return fract((q.x+q.y)*q.z);}
float vnoise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
  return mix(mix(hash12(i),hash12(i+vec2(1,0)),f.x),mix(hash12(i+vec2(0,1)),hash12(i+vec2(1,1)),f.x),f.y);}
float fbm(vec2 p){float a=.5,s=0.;for(int i=0;i<4;i++){s+=a*vnoise(p);p=p*2.03+17.3;a*=.5;}return s;}

// ---------- environment ----------
vec3 sky(vec3 d){
  float y=max(d.y,0.);
  vec3 c=mix(HOR,vec3(.10,.27,.72),pow(y,.45))*uSkyI;
  if(d.y>.02){vec2 q=d.xz/(d.y+.15)*1.3;float cl=smoothstep(.5,.85,fbm(q+vec2(3.1,1.7)));
    c=mix(c,vec3(1.05)*uSkyI+uSunC*.06,cl*.75*smoothstep(.02,.2,d.y));}
  float s=max(dot(d,uSun),0.);
  c+=uSunC*(smoothstep(.99955,.9998,s)*40.+pow(s,900.)*3.+pow(s,10.)*.08);
  return c;
}
vec3 skyAmb(){return vec3(.5,.62,.85)*uSkyI;}
vec3 gAlb(vec2 q){
  float n=fbm(q*14.)*.65+vnoise(q*130.)*.35;
  vec3 a=mix(vec3(.19,.185,.18),vec3(.36,.35,.335),n);
  vec2 g=abs(fract(q/.5)-.5)*.5;
  return a*mix(.5,1.,smoothstep(.0008,.0035,min(g.x,g.y)));
}
vec3 envS(vec3 ro,vec3 rd){
  if(rd.y<-1e-3){float t=-ro.y/rd.y;vec3 p=ro+rd*t;
    vec3 c=gAlb(p.xz)*(uSunC*max(uSun.y,0.)*.32+skyAmb()*.5);
    return mix(c,HOR*uSkyI,1.-exp(-t*.025));}
  return sky(rd);
}

// ---------- water / mist volumes ----------
float fld(vec3 p){vec3 g=clamp((p-uBMin)/uVox,vec3(.5),uUsed-.5);return textureLod(uVol,g*uTexI,0.).r;}
float mst(vec3 p){vec3 g=clamp((p-uBMin)/(uVox*2.),vec3(.5),uMUsed-.5);return textureLod(uMist,g*uMTexI,0.).r;}
vec3 nrm(vec3 p){float e=uVox;
  return normalize(vec3(fld(p-vec3(e,0,0))-fld(p+vec3(e,0,0)),fld(p-vec3(0,e,0))-fld(p+vec3(0,e,0)),fld(p-vec3(0,0,e))-fld(p+vec3(0,0,e)))+1e-6);}
vec3 safeInv(vec3 d){return 1./mix(d,vec3(1e-8),lessThan(abs(d),vec3(1e-8)));}
// march to the next crossing of the iso-surface (entering if !ins, leaving if ins); returns t or -1
float march(vec3 ro,vec3 rd,float t1,bool ins,float jit,out float tau){
  tau=0.;
  vec3 iv=safeInv(rd),a=(uBMin-ro)*iv,b=(uBMax-ro)*iv,mn=min(a,b),mx=max(a,b);
  float ta=max(max(mn.x,mn.y),max(mn.z,0.)),tb=min(min(mx.x,mx.y),min(mx.z,t1));
  if(ta>=tb) return -1.;
  float f=fld(ro+rd*ta);
  if((f>.5)!=ins) return ta;
  float st=uVox*.8,tp=ta,t=ta+st*(.2+.8*jit);bool hit=false;
  for(int i=0;i<420;i++){
    if(t>tb) t=tb;
    vec3 p=ro+rd*t;
    f=fld(p);
    if(!ins) tau+=mst(p)*(t-tp);
    if((f>.5)!=ins){hit=true;break;}
    if(t>=tb) break;
    tp=t; t+=(!ins&&f<.004)?st*2.5:st;
  }
  tau*=200.;
  if(!hit) return (ins&&tb<t1-1e-6)?tb:-1.;
  float lo=tp,hi=t;
  for(int i=0;i<5;i++){float m=.5*(lo+hi);if((fld(ro+rd*m)>.5)!=ins) hi=m; else lo=m;}
  return hi;
}

// ---------- rubber membrane (analytic sphere with growing, petal-shaped tears) ----------
float petal(float p,float a,float b,float c){return 1.+.35*sin(3.*p+a)+.2*sin(7.*p+b)+.1*sin(13.*p+c);}
float memMargin(vec3 u){
  if(uTime<uTe) return 9.;
  float m=acos(clamp(dot(u,uEd),-1.,1.))-(uHole+uVret*(uTime-uTe)*petal(atan(-u.z,dot(u,uEb1)),1.3,.5,2.))/uBR;
  if(uTime>=uTx) m=min(m,acos(clamp(dot(u,uXd),-1.,1.))-(uHole+uVret*(uTime-uTx)*petal(atan(-u.z,dot(u,uXb1)),2.1,4.2,.7))/uBR);
  return m;
}
float memI(vec3 ro,vec3 rd,out vec3 n,out float rim){
  if(uMemOn<.5) return 1e9;
  vec3 oc=ro-uBC;float b=dot(oc,rd),c=dot(oc,oc)-uBR*uBR,h=b*b-c;
  if(h<0.) return 1e9;
  h=sqrt(h);
  float t=-b-h;
  if(t>1e-4){vec3 u=(oc+rd*t)/uBR;float m=memMargin(u);if(m>0.){n=u;rim=m;return t;}}
  t=-b+h;
  if(t>1e-4){vec3 u=(oc+rd*t)/uBR;float m=memMargin(u);if(m>0.){n=u;rim=m;return t;}}
  return 1e9;
}

// ---------- opaque analytic geometry ----------
float ell(vec3 ro,vec3 rd,vec3 c,vec3 A,vec3 B,vec3 D,out vec3 n){
  vec3 q=ro-c,O=vec3(dot(A,q),dot(B,q),dot(D,q)),V=vec3(dot(A,rd),dot(B,rd),dot(D,rd));
  float a=dot(V,V),b=dot(O,V),cc=dot(O,O)-1.,h=b*b-a*cc;
  if(h<0.) return 1e9;
  float t=(-b-sqrt(h))/a;
  if(t<1e-5) return 1e9;
  vec3 s=O+V*t;n=normalize(A*s.x+B*s.y+D*s.z);return t;
}
float bulI(vec3 ro,vec3 rd,out vec3 n,out int part){
  float t=1e9;part=0;
  if(uBul.w<.5) return t;
  float r=uBulD.x,L=uBulD.y,Ln=uBulD.z,xt=uBul.x-L,xn=uBul.x-Ln;
  vec3 oc=ro-vec3(0.,uBul.y,uBul.z);
  float a=rd.y*rd.y+rd.z*rd.z,b=oc.y*rd.y+oc.z*rd.z,c=oc.y*oc.y+oc.z*oc.z-r*r,h=b*b-a*c;
  if(h>0.&&a>1e-12){float tt=(-b-sqrt(h))/a,x=ro.x+rd.x*tt;
    if(tt>1e-5&&x>xt&&x<xn){t=tt;vec3 p=oc+rd*tt;n=vec3(0.,p.y,p.z)/r;}}
  if(abs(rd.x)>1e-9){float tt=(xt-ro.x)/rd.x;vec3 p=oc+rd*tt;
    if(tt>1e-5&&tt<t&&p.y*p.y+p.z*p.z<r*r){t=tt;n=vec3(-1.,0.,0.);part=1;}}
  vec3 o2=ro-vec3(xn,uBul.y,uBul.z),sc=vec3(1./Ln,1./r,1./r),O=o2*sc,V=rd*sc;
  float A=dot(V,V),B=dot(O,V),C=dot(O,O)-1.,hh=B*B-A*C;
  if(hh>0.){float tt=(-B-sqrt(hh))/A;vec3 p=o2+rd*tt;
    if(tt>1e-5&&tt<t&&p.x>=0.){t=tt;n=normalize(p*sc*sc);part=0;}}
  return t;
}
float opq(vec3 ro,vec3 rd,bool gnd,out vec3 n,out int id){
  float t=1e9,tt;id=0;vec3 nn;int pt;
  if(gnd&&rd.y<-1e-6){tt=-ro.y/rd.y;if(tt>0.){t=tt;n=vec3(0.,1.,0.);id=1;}}
  tt=bulI(ro,rd,nn,pt);if(tt<t){t=tt;n=nn;id=2+pt;}
  vec3 kc=uBC+vec3(0.,uBR,0.);
  tt=ell(ro,rd,kc,vec3(1./(uBR*.11),0.,0.),vec3(0.,1./(uBR*.13),0.),vec3(0.,0.,1./(uBR*.11)),nn);if(tt<t){t=tt;n=nn;id=4;}
  float kr=1./(uBR*.075);
  tt=ell(ro,rd,kc+vec3(0.,uBR*.2,0.),vec3(kr,0.,0.),vec3(0.,kr,0.),vec3(0.,0.,kr),nn);if(tt<t){t=tt;n=nn;id=4;}
  {float rs=.0009;vec2 oc=ro.xz-uBC.xz;float a=dot(rd.xz,rd.xz),b=dot(oc,rd.xz),c=dot(oc,oc)-rs*rs,h=b*b-a*c;
   if(h>0.&&a>1e-12){tt=(-b-sqrt(h))/a;float y=ro.y+rd.y*tt;
     if(tt>1e-5&&tt<t&&y>kc.y+uBR*.2){t=tt;vec2 q=(oc+rd.xz*tt)/rs;n=vec3(q.x,0.,q.y);id=5;}}}
  for(int i=0;i<6;i++){if(i>=uShN) break;
    tt=ell(ro,rd,uShC[i],uShA[i],uShB[i],uShD[i],nn);if(tt<t){t=tt;n=nn;id=4;}}
  return t;
}

// ---------- shading ----------
float rubA(float c,float rim){float a=1.-pow(1.-uRubA,1./max(c,.22));return mix(a,1.,smoothstep(.07,0.,rim)*.9);}
vec3 shadow(vec3 p){
  vec3 l=uSun;
  if(uJit.w>.5){vec3 t1=normalize(cross(l,vec3(0.,1.,0.))),t2=cross(l,t1);float a=6.2832*gR.x,r=sqrt(gR.y)*uSoft;l=normalize(l+(t1*cos(a)+t2*sin(a))*r);}
  vec3 n;int id;
  if(opq(p,l,false,n,id)<1e8) return vec3(0.);
  vec3 T=vec3(1.);
  if(uMemOn>.5){
    vec3 oc=p-uBC;float b=dot(oc,l),c=dot(oc,oc)-uBR*uBR,h=b*b-c;
    if(h>0.){h=sqrt(h);
      for(int k=0;k<2;k++){float t=k==0?-b-h:-b+h;
        if(t>0.){vec3 u=(oc+l*t)/uBR;float m=memMargin(u);
          if(m>0.) T*=(1.-rubA(abs(dot(u,l)),m))*mix(vec3(1.),uRub,.8);}}}
  }
  vec3 iv=safeInv(l),a=(uBMin-p)*iv,b=(uBMax-p)*iv,mn=min(a,b),mx=max(a,b);
  float ta=max(max(mn.x,mn.y),max(mn.z,0.)),tb=min(min(mx.x,mx.y),mx.z);
  if(ta<tb){
    float st=uVox*1.5,th=0.,tau=0.,t=ta+st*(uJit.w>.5?gR.x:.5);
    for(int i=0;i<200;i++){
      if(t>=tb) break;
      vec3 q=p+l*t;float f=fld(q);
      th+=smoothstep(.35,.65,f)*st; tau+=mst(q)*st;
      t+=(f<.004)?st*1.6:st;
    }
    if(th>0.) T*=min(mix(.92,.42,smoothstep(.003,.03,th))+85.*th*th,1.5);
    T*=exp(-tau*200.*uMistK*.8);
  }
  return T;
}
float wetAt(vec2 q){
  q+=(vec2(vnoise(q*70.),vnoise(q*70.+31.7))-.5)*.008;
  vec2 uv=(q+uDom)/(2.*uDom)*512.;
  if(uv.x<0.||uv.y<0.||uv.x>510.||uv.y>510.) return 0.;
  ivec2 i=ivec2(floor(uv));vec2 f=fract(uv);
  float a=clamp((uTime-texelFetch(uWet,i,0).r)*300.,0.,1.),b=clamp((uTime-texelFetch(uWet,i+ivec2(1,0),0).r)*300.,0.,1.),
        c=clamp((uTime-texelFetch(uWet,i+ivec2(0,1),0).r)*300.,0.,1.),d=clamp((uTime-texelFetch(uWet,i+ivec2(1,1),0).r)*300.,0.,1.);
  return mix(mix(a,b,f.x),mix(c,d,f.x),f.y);
}
vec3 shadeGround(vec3 p,vec3 rd,float dist){
  float wet=wetAt(p.xz);
  vec3 alb=gAlb(p.xz)*mix(1.,.42,wet);
  vec3 sh=shadow(p+vec3(0.,2e-4,0.));
  // soft sky occlusion under the balloon / falling blob
  vec3 dc=uBC-p;float ao=1.-.55*uMemOn*clamp(uBR*uBR/dot(dc,dc),0.,1.)*max(dc.y/length(dc),0.);
  vec3 c=alb*(uSunC*max(uSun.y,0.)*.32*sh+skyAmb()*.5*ao);
  vec3 r=reflect(rd,vec3(0.,1.,0.));
  float F=.02+.98*pow(1.-max(-rd.y,0.),5.);
  c=mix(c,sky(r)*mix(vec3(1.),sh,.7),wet*min(F*1.6+.03,1.));
  c+=uSunC*sh*pow(max(dot(r,uSun),0.),mix(40.,600.,wet))*mix(.05,2.,wet);
  return mix(c,HOR*uSkyI,1.-exp(-dist*.025));
}
vec3 shadeRub(vec3 p,vec3 n,vec3 rd){
  if(dot(n,rd)>0.) n=-n;
  float ndl=dot(n,uSun);
  vec3 c=uRub*(uSunC*max(ndl,0.)*.32+uSunC*max(-ndl,0.)*.12*uRub+skyAmb()*(.35+.2*n.y));
  vec3 h=normalize(uSun-rd);
  c+=uSunC*pow(max(dot(n,h),0.),260.)*2.5*step(0.,ndl);
  float F=.04+.96*pow(1.-max(dot(n,-rd),0.),5.);
  return mix(c,envS(p,reflect(rd,n)),F*.8);
}
vec3 shadeOpq(int id,vec3 p,vec3 n,vec3 rd,float dist){
  if(id==1) return shadeGround(p,rd,dist);
  if(id==2){ // copper jacket
    vec3 F0=vec3(.95,.62,.48);float c=max(dot(n,-rd),0.);vec3 F=F0+(1.-F0)*pow(1.-c,5.);
    float gr=smoothstep(.0,.0006,abs(abs(p.x-(uBul.x-uBulD.y*.62))-.0000)-uBulD.y*.03);
    vec3 e=envS(p,reflect(rd,n))*.85+uSunC*pow(max(dot(reflect(rd,n),uSun),0.),90.)*1.2;
    return F*e*mix(.45,1.,gr)+F0*.03*skyAmb();
  }
  if(id==3) return vec3(.23,.23,.25)*(skyAmb()*.5+uSunC*max(dot(n,uSun),0.)*.3);
  if(id==4) return shadeRub(p,n,rd);
  return vec3(.8,.78,.72)*(uSunC*max(dot(n,uSun),0.)*.32+skyAmb()*.5);
}

// ---------- path: follows the refracted ray through water, splitting off reflections ----------
vec3 trace(vec3 ro,vec3 rd,float jit){
  vec3 col=vec3(0.),thr=vec3(1.);bool inW=false,inB=false;
  float F0=(uIor-1.)/(uIor+1.);F0*=F0;
  vec3 mistC=uSunC*.24+skyAmb()*.75;
  for(int e=0;e<10;e++){
    vec3 nO,nM;int id;float rim,tau;
    float tO=opq(ro,rd,true,nO,id);
    float tM=memI(ro,rd,nM,rim);
    float tL=min(tO,tM);
    float tW=march(ro,rd,tL,inW,jit,tau);
    float tH=tW>=0.?tW:tL;
    if(inW) thr*=exp(-uAbs*min(tH,3.));
    else{float f=exp(-tau*uMistK);col+=thr*(1.-f)*mistC;thr*=f;}
    if(tW>=0.){
      vec3 p=ro+rd*tW,n=nrm(p);
      if(!inW){
        if(dot(n,rd)>0.) n=-n;
        float c=max(dot(-rd,n),0.),F=F0+(1.-F0)*pow(1.-c,5.);
        if(inB) F=0.; // rubber lies directly on the water: no air gap, no mirror
        if(e<4) col+=thr*F*envS(p,reflect(rd,n));
        thr*=1.-F;rd=refract(rd,n,1./uIor);inW=true;
      }else{
        vec3 m=dot(n,rd)>0.?-n:n;
        vec3 r=refract(rd,m,uIor);
        if(dot(r,r)<.5) rd=reflect(rd,m);
        else{float c=max(dot(r,-m),0.),F=F0+(1.-F0)*pow(1.-c,5.);thr*=1.-F;rd=r;inW=false;}
      }
      ro=p+rd*uVox*.4;
    }else if(tL>=1e8){col+=thr*sky(rd);return col;}
    else if(tM<tO){
      vec3 p=ro+rd*tM;float a=rubA(abs(dot(nM,rd)),rim);
      col+=thr*a*shadeRub(p,nM,rd)*mix(1.,.6,smoothstep(.05,0.,rim));
      thr*=(1.-a)*mix(vec3(1.),uRub,.7);ro=p+rd*2e-4;inB=!inB;
    }else{col+=thr*shadeOpq(id,ro+rd*tO,nO,rd,tO);return col;}
    if(max(thr.x,max(thr.y,thr.z))<.004) return col;
  }
  return col+thr*envS(ro,rd)*.7;
}
vec3 aces(vec3 x){return clamp((x*(2.51*x+.03))/(x*(2.43*x+.59)+.14),0.,1.);}
void main(){
  vec2 fc=gl_FragCoord.xy;
  float r1=hash12(fc+uJit.z*17.13);
  gR=vec2(hash12(fc.yx*1.37+uJit.z*7.77+3.),hash12(fc*.73+uJit.z*3.31+9.));
  vec2 uv=(fc+uJit.xy-.5*uRes)/uRes.y*2.;
  vec3 rd=normalize(uCF+(uCR*uv.x+uCU*uv.y)*uTanF);
  vec3 c=trace(uCP,rd,r1);
  if(!(c.x>=0.&&c.y>=0.&&c.z>=0.)) c=vec3(0.);
  c=min(c,vec3(60.));
  if(uLdr>.5) c=pow(aces(c*uExp),vec3(1./2.2));
  o=vec4(c,1.);
}

</script>
<script>
'use strict';
/* ================= PHYSICS (pure JS, no DOM) =================
   Weakly-compressible SPH (real water sound speed during the impact, adaptive afterwards),
   energy-coupled rigid bullet, analytic tearing membrane, ballistic mist. SI units. */
const Phys = (() => {
  const RHO = 1000, CW = 1480, DOM = 0.62, YTOP = 1.0, MASK = 32767, WETN = 512, MAXM = 14000, NSAMP = 2400;
